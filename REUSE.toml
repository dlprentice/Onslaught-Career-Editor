# Licence map for this repository (REUSE specification 3.3).
# Per-file SPDX lines take precedence where a file has one; the last matching
# annotation below wins for files without one.
# The frozen rebuild copy that stood in rebuild/ was removed on 2026-11-11 (it is at the
# tag archive/20261111-rebuild-frozen-copy, GPL-3.0-only throughout, with its own LICENSE
# and PROVENANCE.md); rebuild/ now holds only a pointer page, annotated with the documentation below.
# The credit for code adapted from Stuart Gillam's Onslaught release is recorded per unit in
# onslaught-godot's rebuild/PROVENANCE.md (https://github.com/dlprentice/onslaught-godot).
# Not covered here: references/ submodules (their own licences).
#
# tests_shared/fixtures/gold_career_save.bin is annotated below with
# LicenseRef-Retail-Save-Fixture, a label for "no licence granted": it is a real
# career save written by the retail game and contributed by vandal_117 as the one
# tracked test baseline (reverse-engineering/project-meta/attribution.md;
# tests_shared/fixtures/README.md). It is game-format data, not project work, and
# no licence was granted with it, so the project's licences are not claimed for
# it (LICENSES/LicenseRef-Retail-Save-Fixture.txt says so in full).
version = 1

# Project code and build files.
[[annotations]]
path = [
    "companion/**",
    "tools/**",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    ".gitmodules",
    ".node-version",
    ".nvmrc",
    "global.json",
    "package.json",
    "package-lock.json",
    "REUSE.toml",
]
SPDX-FileCopyrightText = "David Prentice and Onslaught Toolkit contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Documentation, lore and documentation data tables. lore/** and lore-book/**
# quote developers, interviews and articles; those quotations stay with their
# authors (the quotation note under "Licences" in
# reverse-engineering/project-meta/attribution.md and README.MD's licence table).
[[annotations]]
path = [
    "*.md",
    "*.MD",
    ".github/**",
    "reverse-engineering/**",
    "lore/**",
    "lore-book/**",
    "roadmap/**",
    "companion/**/*.md",
    "docs/**/*.md",
    "tools/**/*.md",
    "rebuild/README.md",
    "tests_shared/fixtures/README.md",
]
SPDX-FileCopyrightText = "David Prentice and Onslaught Toolkit contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ExuberantParrot's PR #1 (2026-07-21), contributed under the repository's MIT
# licence of the time: its passages keep that notice (LICENSES/MIT.txt).
[[annotations]]
path = [
    "reverse-engineering/binary-analysis/functions/ScriptObjectCode.cpp.md",
    "reverse-engineering/binary-analysis/functions/Symtab.cpp.md",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "David Prentice and Onslaught Toolkit contributors",
    "ExuberantParrot (PR #1)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND MIT"

# reverse-engineering/source-code/ quotes and documents Stuart Gillam's published
# Onslaught source (github.com/stuart73/Onslaught, pinned in references/Onslaught,
# GPL version 3 only): the quoted source stays under its GPL-3.0-only licence and
# credit, alongside CC BY-SA 4.0 for this project's text.
[[annotations]]
path = "reverse-engineering/source-code/**"
precedence = "override"
SPDX-FileCopyrightText = [
    "David Prentice and Onslaught Toolkit contributors",
    "Stuart Gillam (Onslaught source release, github.com/stuart73/Onslaught)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND GPL-3.0-only"

# The AYAResourceExtractor notes in the same folder document Stuart's separate
# resource extractor (github.com/stuart73/AYAResourceExtractor, pinned in
# references/AYAResourceExtractor), whose root licence is MIT; they quote it, not
# the GPL game source. This later annotation takes precedence for those files.
[[annotations]]
path = "reverse-engineering/source-code/aya-*"
precedence = "override"
SPDX-FileCopyrightText = [
    "David Prentice and Onslaught Toolkit contributors",
    "Stuart Gillam (AYAResourceExtractor, github.com/stuart73/AYAResourceExtractor)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND MIT"

# The one tracked save: game-format data with no licence granted (see the note at the top).
[[annotations]]
path = "tests_shared/fixtures/gold_career_save.bin"
SPDX-FileCopyrightText = "The rights holders of the game's save-file data, contributed by vandal_117"
SPDX-License-Identifier = "LicenseRef-Retail-Save-Fixture"
